<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14161D"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D2E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3EE6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8B44A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Brand Cinema Flame Gradient -->
    <linearGradient id="cinemaFlame" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5B37"/>
      <stop offset="45%" stop-color="#FF3314"/>
      <stop offset="100%" stop-color="#E02600"/>
    </linearGradient>

    <!-- Kick Gradient for 'R' Leg -->
    <linearGradient id="rLegGrad" x1="26" y1="30" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D2E"/>
      <stop offset="60%" stop-color="#E02600"/>
      <stop offset="100%" stop-color="#3EE6FF"/>
    </linearGradient>

    <!-- Anamorphic Lens Flare Streak Gradient -->
    <linearGradient id="anamorphicStreak" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3EE6FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3EE6FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#3EE6FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3EE6FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="centerGlow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D2E" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3EE6FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)"/>

  <!-- Viewfinder Aspect Frame Brackets (2.39:1 Cinema Crop Marks) -->
  <!-- Top Left -->
  <path d="M8 18 V10 C8 8.9 8.9 8 10 8 H18" stroke="#3EE6FF" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Top Right -->
  <path d="M46 8 H54 C55.1 8 56 8.9 56 10 V18" stroke="#FF4D2E" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Bottom Left -->
  <path d="M8 46 V54 C8 55.1 8.9 56 10 56 H18" stroke="#FF4D2E" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Bottom Right -->
  <path d="M46 56 H54 C55.1 56 56 55.1 56 54 V46" stroke="#3EE6FF" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Center Framing Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Anamorphic Flare Beam passing through center -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="url(#anamorphicStreak)" stroke-width="1.25"/>

  <!-- The Iconic Geometric "R" (RenderLine Cinema Core) -->
  <!-- Vertical Pillar -->
  <rect x="18" y="16" width="6" height="32" rx="2" fill="url(#cinemaFlame)"/>

  <!-- Upper Loop of "R" -->
  <path d="M24 16 H36 C41.523 16 45 19.477 45 24 C45 28.523 41.523 32 36 32 H24 V16 Z M24 22 V26 H35 C36.657 26 38 25.105 38 24 C38 22.895 36.657 22 35 22 H24 Z" fill="url(#cinemaFlame)"/>

  <!-- Diagonal Kick Leg of "R" with Precision Cinema Blade -->
  <path d="M30 31 L42.5 47 C43.2 47.9 44.4 48 45.4 47.3 C46.2 46.7 46.4 45.6 45.7 44.7 L34.5 30.5 Z" fill="url(#rLegGrad)"/>

  <!-- Optical Camera Core Dot (Sensor Gate / Recording Tally) on flare line -->
  <circle cx="45" cy="32" r="2.5" fill="#3EE6FF" filter="url(#bloom)"/>
  <circle cx="45" cy="32" r="1.2" fill="#FFFFFF"/>
</svg>
